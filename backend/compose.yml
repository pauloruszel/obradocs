services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: obradocs
      POSTGRES_USER: obradocs
      POSTGRES_PASSWORD: obradocs
    ports:
      - "5432:5432"
    volumes:
      - obradocs_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obradocs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  obradocs_postgres:
