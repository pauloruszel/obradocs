<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Redefinir senha | Obradocs</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f8fa;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 420px);
      padding: 28px;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 22px; color: #475569; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font: inherit;
    }
    input:focus { outline: 2px solid #0c5baa; outline-offset: 1px; }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 20px;
      border: 0;
      border-radius: 6px;
      background: #0c5baa;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 24px; margin: 16px 0 0; color: #b91c1c; }
    #message.success { color: #166534; }
  </style>
</head>
<body>
  <main>
    <h1>Definir nova senha</h1>
    <p>Crie uma senha com pelo menos 8 caracteres, incluindo maiuscula, minuscula e numero.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input id="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <label for="confirmation">Confirmar senha</label>
      <input id="confirmation" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <button type="submit">Atualizar senha</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>
  <script>
    const form = document.querySelector("#reset-form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const token = new URLSearchParams(location.search).get("token");

    if (!token) {
      message.textContent = "Link invalido. Solicite uma nova redefinicao de senha.";
      button.disabled = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.querySelector("#password").value;
      const confirmation = document.querySelector("#confirmation").value;

      if (!/[a-z]/.test(password) || !/[A-Z]/.test(password) || !/[0-9]/.test(password)) {
        message.textContent = "Inclua maiuscula, minuscula e numero.";
        return;
      }
      if (password !== confirmation) {
        message.textContent = "As senhas nao coincidem.";
        return;
      }

      button.disabled = true;
      message.textContent = "";
      try {
        const response = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, senha: password })
        });
        if (!response.ok) {
          const body = await response.text();
          let detail;
          try {
            detail = JSON.parse(body).detail;
          } catch {
            detail = body;
          }
          throw new Error(detail || `Nao foi possivel redefinir a senha (erro ${response.status}).`);
        }
        history.replaceState({}, "", location.pathname);
        form.reset();
        message.className = "success";
        message.textContent = "Senha redefinida. Voce ja pode entrar no Obradocs.";
        button.hidden = true;
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
