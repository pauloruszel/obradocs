<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Redefinir senha | Obradocs</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: #f4f7fb;
    }
    main {
      width: min(100%, 440px);
      padding: 32px;
      background: #fff;
      border: 1px solid #dfe5ec;
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, .08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-size: 18px;
      font-weight: 750;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #0c5baa;
      color: #fff;
      font-size: 21px;
      font-weight: 800;
    }
    .eyebrow {
      margin-bottom: 8px;
      color: #0c5baa;
      font-size: 13px;
      font-weight: 750;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #0f172a;
      font-size: clamp(26px, 7vw, 32px);
      line-height: 1.2;
    }
    .intro {
      margin: 10px 0 24px;
      color: #475569;
      line-height: 1.55;
    }
    label {
      display: block;
      margin: 16px 0 7px;
      color: #1e293b;
      font-weight: 650;
    }
    input[type="password"],
    input[type="text"] {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #0f172a;
      font: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:hover { border-color: #94a3b8; }
    input:focus {
      outline: none;
      border-color: #0c5baa;
      box-shadow: 0 0 0 3px rgba(12, 91, 170, .14);
    }
    input[aria-invalid="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, .1);
    }
    .requirements {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
      margin: 12px 0 4px;
      padding: 0;
      color: #64748b;
      font-size: 13px;
      list-style: none;
    }
    .requirements li::before {
      content: "•";
      margin-right: 7px;
      color: #94a3b8;
    }
    .requirements li.valid { color: #166534; }
    .requirements li.valid::before { content: "✓"; color: #16a34a; }
    .show-password {
      display: flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      margin: 14px 0 0;
      color: #475569;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .show-password input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #0c5baa;
    }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #0c5baa;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    button:hover:not(:disabled) { background: #094d91; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgba(12, 91, 170, .25); outline-offset: 2px; }
    button:disabled { opacity: .58; cursor: wait; }
    .message {
      min-height: 22px;
      margin: 14px 0 0;
      color: #b91c1c;
      line-height: 1.45;
    }
    .success {
      padding: 18px 0 2px;
      text-align: center;
    }
    .success-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      font-size: 24px;
      font-weight: 800;
    }
    .success h2 { margin: 0; font-size: 22px; }
    .success p { margin: 8px 0 0; color: #475569; line-height: 1.5; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) {
      body { padding-left: 12px; padding-right: 12px; }
      main { padding: 26px 22px; }
      .brand { margin-bottom: 24px; }
      .requirements { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-label="Obradocs">
      <span class="brand-mark" aria-hidden="true">O</span>
      <span>Obradocs</span>
    </div>
    <div class="eyebrow">Segurança da conta</div>
    <h1>Definir nova senha</h1>
    <p class="intro">Crie uma senha segura para voltar a acessar seus documentos.</p>
    <form id="reset-form">
      <label for="password">Nova senha</label>
      <input
        id="password"
        type="password"
        minlength="8"
        maxlength="72"
        autocomplete="new-password"
        aria-describedby="password-requirements"
        required
      >
      <ul id="password-requirements" class="requirements" aria-label="Requisitos da senha">
        <li data-rule="length">Pelo menos 8 caracteres</li>
        <li data-rule="uppercase">Uma letra maiúscula</li>
        <li data-rule="lowercase">Uma letra minúscula</li>
        <li data-rule="number">Um número</li>
      </ul>
      <label for="confirmation">Confirmar senha</label>
      <input id="confirmation" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <label class="show-password" for="show-password">
        <input id="show-password" type="checkbox">
        Mostrar senhas
      </label>
      <button type="submit">Atualizar senha</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <section id="success" class="success" aria-live="polite" hidden>
      <div class="success-mark" aria-hidden="true">✓</div>
      <h2>Senha atualizada</h2>
      <p>Volte ao Obradocs e entre com sua nova senha.</p>
    </section>
  </main>
  <script>
    const form = document.querySelector("#reset-form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const passwordInput = document.querySelector("#password");
    const confirmationInput = document.querySelector("#confirmation");
    const showPassword = document.querySelector("#show-password");
    const success = document.querySelector("#success");
    const token = new URLSearchParams(location.search).get("token");
    const rules = {
      length: password => password.length >= 8 && password.length <= 72,
      uppercase: password => /[A-Z]/.test(password),
      lowercase: password => /[a-z]/.test(password),
      number: password => /[0-9]/.test(password)
    };

    const setMessage = text => {
      message.textContent = text;
      passwordInput.setAttribute("aria-invalid", text ? "true" : "false");
      confirmationInput.setAttribute("aria-invalid", text ? "true" : "false");
    };

    const updateRequirements = () => {
      const password = passwordInput.value;
      Object.entries(rules).forEach(([name, isValid]) => {
        document.querySelector(`[data-rule="${name}"]`).classList.toggle("valid", isValid(password));
      });
    };

    if (!token) {
      form.hidden = true;
      setMessage("Este link é inválido. Solicite uma nova redefinição de senha no Obradocs.");
    }

    passwordInput.addEventListener("input", () => {
      updateRequirements();
      setMessage("");
    });
    confirmationInput.addEventListener("input", () => setMessage(""));
    showPassword.addEventListener("change", () => {
      const type = showPassword.checked ? "text" : "password";
      passwordInput.type = type;
      confirmationInput.type = type;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = passwordInput.value;
      const confirmation = confirmationInput.value;

      if (!Object.values(rules).every(rule => rule(password))) {
        setMessage("A senha ainda não atende a todos os requisitos.");
        return;
      }
      if (password !== confirmation) {
        setMessage("As senhas não coincidem.");
        confirmationInput.focus();
        return;
      }

      button.disabled = true;
      button.textContent = "Atualizando...";
      setMessage("");
      try {
        const response = await fetch("/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, senha: password })
        });
        if (!response.ok) {
          const body = await response.text();
          let detail;
          try {
            detail = JSON.parse(body).detail;
          } catch {
            detail = body;
          }
          if (response.status === 400) {
            throw new Error("Este link é inválido ou expirou. Solicite uma nova redefinição de senha.");
          }
          throw new Error(detail || "Não foi possível redefinir a senha. Tente novamente.");
        }
        history.replaceState({}, "", location.pathname);
        form.reset();
        form.hidden = true;
        message.hidden = true;
        success.hidden = false;
      } catch (error) {
        const text =
          error instanceof TypeError
            ? "Não foi possível conectar ao Obradocs. Verifique sua internet e tente novamente."
            : error.message;
        setMessage(text);
        button.disabled = false;
        button.textContent = "Atualizar senha";
      }
    });
  </script>
</body>
</html>
