<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada | Obradocs</title>
    <link rel="icon" href="/obradocs/favicon.ico" />
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        color: #101828;
        background: #f5f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 480px);
        padding: 40px 32px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #dce2ea;
        border-radius: 8px;
        box-shadow: 0 16px 40px rgb(16 24 40 / 10%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
        font-size: 22px;
        font-weight: 700;
      }

      .brand img {
        width: 42px;
        height: 42px;
      }

      .code {
        margin: 0 0 8px;
        color: #0c5baa;
        font-size: 14px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
      }

      p {
        margin: 16px 0 28px;
        color: #667085;
        font-size: 17px;
        line-height: 1.55;
      }

      a {
        display: block;
        width: 100%;
        padding: 15px 20px;
        color: #ffffff;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
        background: #0c5baa;
        border-radius: 8px;
      }

      a:focus-visible {
        outline: 3px solid #84c5f4;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/obradocs/favicon.ico" alt="" />
        <span>Obradocs</span>
      </div>
      <div class="code">ERRO 404</div>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou foi removido.</p>
      <a href="/obradocs/">Voltar ao Obradocs</a>
    </main>
  </body>
</html>
