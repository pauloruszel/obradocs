name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://obradocs-production.up.railway.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:web
      # Avisos altos restantes pertencem ao toolchain do Expo 54 e exigem upgrade quebrador do SDK.
      - run: npm audit --omit=dev --audit-level=critical

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    name: backend (Java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: chmod +x mvnw
        working-directory: backend
      - run: ./mvnw test
        working-directory: backend
