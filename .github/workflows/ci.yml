name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://obradocs-production.up.railway.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run web:build
      # Avisos altos restantes pertencem ao toolchain do Expo 54 e exigem upgrade quebrador do SDK.
      - run: npm audit --omit=dev --audit-level=critical

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
        working-directory: backend
      - run: ./mvnw test
        working-directory: backend
